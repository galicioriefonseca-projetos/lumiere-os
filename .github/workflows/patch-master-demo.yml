name: Apply Master Demo Panel Patch

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/patch-master-demo.mjs'
      - 'src/pages/MasterPanel.tsx'
      - '.github/workflows/patch-master-demo.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply patch
        run: node scripts/patch-master-demo.mjs

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/MasterPanel.tsx
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "chore(master): apply demo panel patch"
            git push
          fi
