name: Fix Asaas checkout redirect

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply payment fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          register = Path('src/pages/auth/RegisterPage.tsx')
          text = register.read_text()

          old = """      toast.success('Pronto! Redirecionando para o ambiente seguro...');
      
      const targetUrl = checkoutResult.checkoutUrl;
      try {
        window.location.assign(targetUrl);
      } catch {
        window.open(targetUrl, '_blank', 'noopener,noreferrer');
      }
"""
          new = """      toast.success('Pronto! Abrindo o pagamento seguro do Asaas...');

      const targetUrl = checkoutResult.checkoutUrl;
      const isEmbeddedPreview = window.self !== window.top;
      let paymentWindow: Window | null = null;

      // O Preview do Google AI Studio roda a aplicação em um frame.
      // O Checkout do Asaas é uma página hospedada externamente e deve abrir
      // em contexto de nível superior, nunca dentro do frame do Preview.
      if (isEmbeddedPreview) {
        paymentWindow = window.open('about:blank', '_blank');
      }

      if (paymentWindow && !paymentWindow.closed) {
        paymentWindow.location.href = targetUrl;
      } else if (isEmbeddedPreview) {
        throw new Error('O navegador bloqueou a abertura do pagamento. Abra o LumiereOS em uma nova aba e tente novamente.');
      } else {
        window.location.assign(targetUrl);
      }
"""
          if old not in text:
              raise SystemExit('RegisterPage: bloco de redirecionamento não encontrado; nenhuma alteração aplicada.')
          text = text.replace(old, new, 1)

          old_pix = """                    <option value=\"CREDIT_CARD\">Cartão de Crédito</option>
                    <option value=\"PIX\">PIX</option>
"""
          new_pix = """                    <option value=\"CREDIT_CARD\">Cartão de Crédito</option>
"""
          if old_pix not in text:
              raise SystemExit('RegisterPage: opção PIX não encontrada; nenhuma alteração aplicada.')
          text = text.replace(old_pix, new_pix, 1)
          text = text.replace(
              '<span className=\"text-xs text-zinc-400\">Forma de Pagamento</span>',
              '<span className=\"text-xs text-zinc-400\">Forma de Pagamento</span>',
              1
          )
          register.write_text(text)

          checkout = Path('server/routes/billing/create-checkout.ts')
          text = checkout.read_text()
          old = """    const chosenMethod = reqMethod as 'CREDIT_CARD' | 'PIX';
"""
          new = """    if (reqMethod !== 'CREDIT_CARD') {
      return res.status(400).json({
        success: false,
        code: 'PAYMENT_METHOD_UNAVAILABLE',
        error: 'A assinatura recorrente pelo Checkout do Asaas utiliza Cartão de Crédito. PIX será disponibilizado em um fluxo de cobrança recorrente específico.'
      });
    }
    const chosenMethod = 'CREDIT_CARD' as const;
"""
          if old not in text:
              raise SystemExit('create-checkout: bloco de método de pagamento não encontrado.')
          text = text.replace(old, new, 1)
          checkout.write_text(text)

          provider = Path('server/billing/AsaasProvider.ts')
          text = provider.read_text()
          old = """      // Asaas exige obrigatoriamente CREDIT_CARD para operações RECURRENT
      billingTypes: ['CREDIT_CARD'],
"""
          new = """      // Checkout RECURRENT é o fluxo de assinatura hospedado do Asaas.
      // Conforme a documentação atual, este fluxo utiliza CREDIT_CARD.
      billingTypes: ['CREDIT_CARD'],
"""
          if old in text:
              text = text.replace(old, new, 1)
          provider.write_text(text)
          PY

      - name: Validate build
        run: |
          npm ci
          npm run build

      - name: Commit fixes and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/auth/RegisterPage.tsx server/routes/billing/create-checkout.ts server/billing/AsaasProvider.ts .github/workflows/fix-asaas-checkout-redirect.yml
          git rm .github/workflows/fix-asaas-checkout-redirect.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(billing): open Asaas checkout outside embedded preview"
          git push
