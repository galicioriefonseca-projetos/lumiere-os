<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumière - Gestão Premium para Salões e Clínicas</title>
    <meta name="description" content="Sistema de gestão premium para salões de beleza, clínicas de estética e barbearias.">
    <meta name="theme-color" content="#D4AF37" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LumiereOS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0a0a0a; color: white; font-family: system-ui, -apple-system, sans-serif; padding: 24px; text-align: center;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 24px; animation: spin 2s linear infinite;">
          <line x1="12" y1="2" x2="12" y2="6"></line>
          <line x1="12" y1="18" x2="12" y2="22"></line>
          <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
          <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
          <line x1="2" y1="12" x2="6" y2="12"></line>
          <line x1="18" y1="12" x2="22" y2="12"></line>
          <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
          <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
        </svg>
        <style>
          @keyframes spin { 100% { transform: rotate(360deg); } }
        </style>
        <h1 style="font-size: 20px; font-weight: 600; margin-bottom: 8px; color: #D4AF37;">Carregando LumiereOS...</h1>
        <p style="color: #a3a3a3; font-size: 14px; margin-bottom: 32px; max-width: 300px;">Preparando seu sistema de gestão premium.</p>
        
        <script>
          // Show reload button after 6 seconds if app hasn't loaded
          setTimeout(function() {
            var btn = document.getElementById('init-reload-btn');
            if (btn) btn.style.display = 'block';
          }, 6000);
          
          function forceClear() {
            try {
              localStorage.clear();
              sessionStorage.clear();
              if ('ServiceWorkerRegistration' in window) {
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                  for(let registration of registrations) {
                    registration.unregister();
                  }
                });
              }
              if ('caches' in window) {
                caches.keys().then(function(names) {
                  for (let name of names) caches.delete(name);
                });
              }
            } catch(e) {}
            window.location.href = '/?fresh=' + Date.now();
          }
        </script>
        
        <button id="init-reload-btn" onclick="forceClear()" style="display: none; background: #262626; color: white; border: 1px solid #404040; padding: 10px 20px; border-radius: 8px; font-weight: 500; cursor: pointer;">
          Limpar Cache e Recarregar
        </button>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
