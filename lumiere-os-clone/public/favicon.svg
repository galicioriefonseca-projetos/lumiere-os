    <!-- Circles at peaks -->
    <circle cx="150" cy="242" r="10" fill="#D4AF37"/>
    <circle cx="200" cy="190" r="12" fill="#D4AF37"/>
    <circle cx="256" cy="148" r="15" fill="#D4AF37"/>
    <circle cx="312" cy="190" r="12" fill="#D4AF37"/>
    <circle cx="362" cy="242" r="10" fill="#D4AF37"/>
